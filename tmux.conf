# =============================================================================
# TMUX — COMMAND CONTROL CENTER
# Author: andev0x
#
# Design language
#   • zero visual noise: no powerline pills, badges or gradients
#   • micro-contrast: one dark base, one muted slate, accents only for state
#   • two accents carry meaning — cyan (focus) and amber (prefix armed)
#   • telemetry is cached and sampled out of band, never blocking the UI
# =============================================================================


# =============================================================================
# 1. CORE BEHAVIOUR
# =============================================================================

# Modal input must never lag behind the escape key (Neovim / lazygit)
set -sg escape-time 0

# Status telemetry cadence; scripts are memoised, so 2s stays cheap
set -g status-interval 2

set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g history-limit 50000
set -g display-time 1500

# Alert without stealing the command line
setw -g monitor-activity on
set -g visual-activity off
setw -g monitor-bell on
set -g visual-bell off

# Natural keyboard reach and stable window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# =============================================================================
# 2. TERMINAL CAPABILITIES — 24-BIT TRUECOLOR
# =============================================================================

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"
set -as terminal-features ",*:RGB"

# Extended CSI-u keys for modern Neovim bindings
set -g extended-keys on
set -g extended-keys-format csi-u

# Vi motions inside copy mode
setw -g mode-keys vi

# Context-aware window naming (basename of the pane path)
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'


# =============================================================================
# 3. PALETTE — TOKYONIGHT / DEEP FOREST
# =============================================================================

base="#16161e"          # status bar + structural background
surface="#1a1b26"       # elevated surface (messages)
slate="#292e42"         # muted slate: active window bed, borders
dim="#565f89"           # dim text: inactive windows, clock
text="#c0caf5"          # readable body text
cyan="#7dcfff"          # accent: active window / focus
blue="#7aa2f7"          # accent: session state, git workspace
amber="#e0af68"         # accent: prefix armed
purple="#bb9af7"        # accent: zoom + git refresh
teal="#73daca"          # accent: hardware telemetry
session="#3d59a1"       # session block bed
sep="#414868"           # vertical separators


# =============================================================================
# 4. KEYBINDINGS
# =============================================================================

# Ctrl+a prefix (Ctrl+b unbound), Ctrl+a twice sends a literal Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Meta-based pane navigation, immune to Neovim's own mappings
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window cycling
bind -r C-h previous-window
bind -r C-l next-window

# Continuous pane resizing
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 3
bind -r Down resize-pane -D 3

# Zoom toggle
bind z resize-pane -Z

# Directory-aware splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Hot reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Confirmed destruction
bind x confirm-before -p "Kill active pane? (y/n)" kill-pane
bind X confirm-before -p "Kill active window? (y/n)" kill-window
bind Q confirm-before -p "Kill active session? (y/n)" kill-session

# Force a synchronous git telemetry refresh for the current workspace
bind u run-shell "TMUX_GIT_FORCE=1 bash ~/.config/tmux/scripts/git-update.sh '#{pane_current_path}' >/dev/null" \; display-message "Git telemetry refreshed"


# =============================================================================
# 5. POPUP INTEGRATIONS
# =============================================================================

# Popups inherit the terminal's dark base: same body colour as the status bar,
# a dim slate border and rounded corners so they read as part of the surface.
bind p display-popup -E -b rounded -s "bg=${base},fg=${blue}" -S "fg=${sep}" -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

bind P display-popup -E -b rounded -s "bg=${base},fg=${blue}" -S "fg=${sep}" -w 80% -h 80% -d "#{pane_current_path}" \
  "tmux new-session -A -s scratch"

bind g display-popup -E -b rounded -s "bg=${base},fg=${blue}" -S "fg=${sep}" -w 90% -h 90% -d "#{pane_current_path}" \
  "sh -c 'command -v lazygit >/dev/null && lazygit || (echo \"lazygit not installed\"; read); TMUX_GIT_FORCE=1 bash ~/.config/tmux/scripts/git-update.sh \"#{pane_current_path}\"'"

bind y display-popup -E -b rounded -s "bg=${base},fg=${blue}" -S "fg=${sep}" -w 90% -h 90% -d "#{pane_current_path}" \
  "sh -c 'command -v yazi >/dev/null && yazi || (echo \"yazi not installed\"; read); TMUX_GIT_FORCE=1 bash ~/.config/tmux/scripts/git-update.sh \"#{pane_current_path}\"'"


# =============================================================================
# 6. STATUS BAR
# =============================================================================

set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=${base},fg=${dim}"

# ------------------------------------------
# LEFT — session context / prefix state
# ------------------------------------------
# A single block that swaps identity when the prefix is armed: calm blue
# session state in normal mode, amber prefix state while the leader is held.
# Attribute groups are split into separate #[...] blocks because a comma
# inside a conditional branch would terminate the #{?...} expression.
set -g status-left-length 40
set -g status-left "\
#{?client_prefix,\
#[bg=${amber}]#[fg=${base}]#[bold] 󰘳 PREFIX ,\
#[bg=${session}]#[fg=${blue}]#[bold] 󰖲 #S }"

# ------------------------------------------
# CENTRE — window list
# ------------------------------------------
setw -g window-status-separator "  "

# Inactive: low-contrast, non-distracting
setw -g window-status-format "#[fg=${dim}] #I:#W "

# tmux 3.8 defaults window-status-current-style to "underscore"; the slate bed
# is the only focus signal we want, so clear attributes at the option level too.
setw -g window-status-current-style "default"

# Active: soft slate bed, bold cyan; purple zoom badge, no underline clutter
setw -g window-status-current-format "\
#[fg=${cyan}]#[bg=${slate}]#[bold] #I:#W\
#{?window_zoomed_flag, #[fg=${purple}]#[bg=${slate}]#[nobold]󰍉 [Z],} "

# Activity and bell: amber, no layout shift
setw -g window-status-activity-style "fg=${amber},bg=${base}"
setw -g window-status-bell-style "fg=${amber},bg=${base},bold"

# ------------------------------------------
# RIGHT — script-driven telemetry
# ------------------------------------------
# cpu.sh        → CPU + RAM            (teal)
# git-read.sh   → branch + dirty count (blue)   [pure cache read]
# git-update.sh → upstream divergence  (purple) [stale-while-revalidate]
# %H:%M         → single clock, dim
set -g status-right-length 160
set -g status-right "\
#[fg=${teal}]#(bash ~/.config/tmux/scripts/cpu.sh)\
#[fg=${sep}] │ \
#[fg=${blue}]#(bash ~/.config/tmux/scripts/git-read.sh \"#{pane_current_path}\")\
#[fg=${sep}] │ \
#[fg=${purple}]#(bash ~/.config/tmux/scripts/git-update.sh \"#{pane_current_path}\")\
#[fg=${sep}] │ \
#[fg=${dim}]%H:%M "


# =============================================================================
# 7. PANE VISUALS
# =============================================================================

# Inactive borders recede into the slate; focus is announced by one accent line
set -g pane-border-style "fg=${slate}"
set -g pane-active-border-style "fg=${blue}"

set -g message-style "bg=${surface},fg=${cyan},bold"
set -g mode-style "bg=${slate},fg=${cyan}"


# =============================================================================
# 8. COPY MODE & CLIPBOARD BRIDGE
# =============================================================================

bind-key -T copy-mode-vi v send-keys -X begin-selection

# pbcopy → wl-copy → xclip → OSC 52 (Ghostty handles the last one natively)
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'if-shell "command -v wl-copy >/dev/null 2>&1" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \"wl-copy\"" \
    "if-shell \"command -v xclip >/dev/null 2>&1\" \
      \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard\\\"\" \
      \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel\""'


# =============================================================================
# 9. PLUGINS (TPM)
# =============================================================================

# Pin TPM's plugin directory. Without this, TPM's XDG detection resolves to
# ~/.config/tmux/plugins/ and clones plugins inside this repository.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

run '~/.tmux/plugins/tpm/tpm'
