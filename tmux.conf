# =============================================================================
# TMUX — COMMAND CONTROL CENTER
# Author: andev0x
#
# Design language
#   • zero visual noise: no powerline pills, badges or gradients
#   • two palettes, one layout: tokyonight (default) and obsidian
#   • luminance, not saturation, separates the layers
#   • accents stay quiet: focus marks the active window, alert marks state
#   • telemetry is cached and sampled out of band, never blocking the UI
# =============================================================================


# =============================================================================
# 1. CORE BEHAVIOUR
# =============================================================================

# Modal input must never lag behind the escape key (Neovim / lazygit)
set -sg escape-time 0

# Status telemetry cadence; scripts are memoised, so 2s stays cheap
set -g status-interval 2

set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g history-limit 50000
set -g display-time 1500

# Let Ghostty's tab/window title track the tmux session:window and the pane
# title set by shell integration. `allow-rename` stays off, so this only
# affects the outer window title, never tmux's own window names.
set -g set-titles on

# Alert without stealing the command line
setw -g monitor-activity on
set -g visual-activity off
setw -g monitor-bell on
set -g visual-bell off

# Natural keyboard reach and stable window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# =============================================================================
# 2. TERMINAL CAPABILITIES — 24-BIT TRUECOLOR
# =============================================================================

set -g default-terminal "tmux-256color"

# Reset to tmux's built-in defaults before appending. Plain `set -as` appends a
# fresh ",*:RGB" on every `source-file`, so these arrays grow without bound
# (they were up to 14 duplicates). `set -u` restores the compiled-in defaults,
# making reloads idempotent while still keeping the single RGB entry.
set -u terminal-overrides
set -as terminal-overrides ",*:RGB"
set -u terminal-features
set -as terminal-features ",*:RGB"

# Let image protocols (Kitty graphics / sixel) reach Ghostty instead of being
# swallowed by tmux: previews in yazi, Neovim image plugins, `icat`, etc.
# `on` only allows the visible pane; `all` also allows off-screen panes.
set -g allow-passthrough on

# Yazi detects the image protocol from TERM/TERM_PROGRAM. Keep those current
# when the tmux server outlives a terminal change, otherwise previews silently
# fall back to no-image mode. Reset the global copy first so reloads stay
# idempotent (plain `set -ga` would append another pair every source-file).
set -gu update-environment
set -ag update-environment TERM
set -ag update-environment TERM_PROGRAM

# Extended CSI-u keys for modern Neovim bindings
set -g extended-keys on
set -g extended-keys-format csi-u

# Vi motions inside copy mode
setw -g mode-keys vi

# Context-aware window naming (basename of the pane path)
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'


# =============================================================================
# 3. THEME SELECTION
# =============================================================================
#
# Two palettes ship with this config. Change the value on the next line and
# reload with prefix + r:
#
#   tokyonight   (default) — original slate-blue base, cyan focus, amber prefix
#   obsidian               — near-black base, a single forest-green ramp
#
# Anything other than "obsidian" falls back to the default. The selector is a
# hidden variable: it is read while parsing but never exported to your shells.
%hidden TMUX_THEME=obsidian

# Every style below reads semantic tokens (${focus}, ${work}, ${alert}, …),
# never raw colours. A theme only has to define that token set to repaint the
# whole UI consistently.
%if "#{==:$TMUX_THEME,obsidian}"

# --- Obsidian Grove ----------------------------------------------------------
%hidden base="#0a0d0b"          # status bar + structural background
%hidden surface="#101612"       # elevated surface (messages)
%hidden slate="#1e2a22"         # raised bed: active window, inactive borders
%hidden session="#263b2e"       # session block bed
%hidden dim="#5f6f63"           # dim text: inactive windows, clock
%hidden text="#c6d4c9"          # readable body text
%hidden focus="#8fc7a0"         # active window, message/mode highlight
%hidden work="#8fc7a0"          # session, git workspace, popups, focused pane
%hidden notice="#a9d9ba"        # transient message highlight
%hidden alert="#a9d9ba"         # activity and bell
%hidden badge="#7a9b87"         # zoom indicator, upstream divergence
%hidden data="#4f8b6b"          # CPU and memory telemetry
%hidden prefix="#8fc7a0"        # prefix-armed block bed (inverted)
%hidden sep="#34423a"           # vertical separators

%else

# --- Tokyo Night (default) ---------------------------------------------------
%hidden base="#16161e"          # status bar + structural background
%hidden surface="#1a1b26"       # elevated surface (messages)
%hidden slate="#292e42"         # raised bed: active window, inactive borders
%hidden session="#3d59a1"       # session block bed
%hidden dim="#565f89"           # dim text: inactive windows, clock
%hidden text="#c0caf5"          # readable body text
%hidden focus="#7dcfff"         # active window, message/mode highlight
%hidden work="#7aa2f7"          # session, git workspace, popups, focused pane
%hidden notice="#7dcfff"        # transient message highlight
%hidden alert="#e0af68"         # activity and bell
%hidden badge="#bb9af7"         # zoom indicator, upstream divergence
%hidden data="#73daca"          # CPU and memory telemetry
%hidden prefix="#e0af68"        # prefix-armed block bed
%hidden sep="#414868"           # vertical separators

%endif


# =============================================================================
# 4. KEYBINDINGS
# =============================================================================

# Ctrl+a prefix (Ctrl+b unbound), Ctrl+a twice sends a literal Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Meta-based pane navigation, immune to Neovim's own mappings
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window cycling
bind -r C-h previous-window
bind -r C-l next-window

# Continuous pane resizing
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 3
bind -r Down resize-pane -D 3

# Zoom toggle
bind z resize-pane -Z

# Directory-aware splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Hot reload
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Confirmed destruction
bind x confirm-before -p "Kill active pane? (y/n)" kill-pane
bind X confirm-before -p "Kill active window? (y/n)" kill-window
bind Q confirm-before -p "Kill active session? (y/n)" kill-session

# Force a synchronous git telemetry refresh for the current workspace
bind u run-shell "TMUX_GIT_FORCE=1 bash ~/.config/tmux/scripts/git-update.sh '#{pane_current_path}' >/dev/null" \; display-message "Git telemetry refreshed"


# =============================================================================
# 5. POPUP INTEGRATIONS
# =============================================================================

# Popups inherit the terminal's dark base: same body colour as the status bar,
# a dim palette-matched border and rounded corners so they read as part of the surface.
bind p display-popup -E -b rounded -s "bg=${base},fg=${work}" -S "fg=${sep}" -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

bind P display-popup -E -b rounded -s "bg=${base},fg=${work}" -S "fg=${sep}" -w 80% -h 80% -d "#{pane_current_path}" \
  "tmux new-session -A -s scratch"

bind g display-popup -E -b rounded -s "bg=${base},fg=${work}" -S "fg=${sep}" -w 90% -h 90% -d "#{pane_current_path}" \
  "sh -c 'command -v lazygit >/dev/null && lazygit || (echo \"lazygit not installed\"; read); TMUX_GIT_FORCE=1 bash ~/.config/tmux/scripts/git-update.sh \"#{pane_current_path}\"'"

bind y display-popup -E -b rounded -s "bg=${base},fg=${work}" -S "fg=${sep}" -w 90% -h 90% -d "#{pane_current_path}" \
  "sh -c 'command -v yazi >/dev/null && yazi || (echo \"yazi not installed\"; read); TMUX_GIT_FORCE=1 bash ~/.config/tmux/scripts/git-update.sh \"#{pane_current_path}\"'"


# =============================================================================
# 6. STATUS BAR
# =============================================================================

set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=${base},fg=${dim}"

# ------------------------------------------
# LEFT — session context / prefix state
# ------------------------------------------
# A single block that swaps identity when the prefix is armed: the session bed
# in normal mode, the inverted prefix accent while the leader is held.
# Attribute groups are split into separate #[...] blocks because a comma
# inside a conditional branch would terminate the #{?...} expression.
set -g status-left-length 40
set -g status-left "\
#{?client_prefix,\
#[bg=${prefix}]#[fg=${base}]#[bold] 󰘳 PREFIX ,\
#[bg=${session}]#[fg=${work}]#[bold] 󰖲 #S }"

# ------------------------------------------
# CENTRE — window list
# ------------------------------------------
setw -g window-status-separator "  "

# Inactive: low-contrast, non-distracting
setw -g window-status-format "#[fg=${dim}] #I:#W "

# tmux 3.8 defaults window-status-current-style to "underscore"; the slate bed
# is the only focus signal we want, so clear attributes at the option level too.
setw -g window-status-current-style "default"

# Active: raised slate bed, bold focus accent; zoom marker dimmed, no underline
setw -g window-status-current-format "\
#[fg=${focus}]#[bg=${slate}]#[bold] #I:#W\
#{?window_zoomed_flag, #[fg=${badge}]#[bg=${slate}]#[nobold]󰍉 [Z],} "

# Activity and bell: alert accent, no layout shift
setw -g window-status-activity-style "fg=${alert},bg=${base}"
setw -g window-status-bell-style "fg=${alert},bg=${base},bold"

# ------------------------------------------
# RIGHT — script-driven telemetry
# ------------------------------------------
# cpu.sh        → CPU + RAM            (data)
# git-read.sh   → branch + dirty count (work)   [pure cache read]
# git-update.sh → upstream divergence  (badge)  [stale-while-revalidate]
# %H:%M         → single clock, dim
set -g status-right-length 160
set -g status-right "\
#[fg=${data}]#(bash ~/.config/tmux/scripts/cpu.sh)\
#[fg=${sep}] │ \
#[fg=${work}]#(bash ~/.config/tmux/scripts/git-read.sh \"#{pane_current_path}\")\
#[fg=${sep}] │ \
#[fg=${badge}]#(bash ~/.config/tmux/scripts/git-update.sh \"#{pane_current_path}\")\
#[fg=${sep}] │ \
#[fg=${dim}]%H:%M "


# =============================================================================
# 7. PANE VISUALS
# =============================================================================

# Inactive borders recede into the slate; focus is announced by one accent line
set -g pane-border-style "fg=${slate}"
set -g pane-active-border-style "fg=${work}"

set -g message-style "bg=${surface},fg=${notice},bold"
set -g mode-style "bg=${slate},fg=${notice}"


# =============================================================================
# 8. COPY MODE & CLIPBOARD BRIDGE
# =============================================================================

bind-key -T copy-mode-vi v send-keys -X begin-selection

# pbcopy → wl-copy → xclip → OSC 52 (Ghostty handles the last one natively)
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'if-shell "command -v wl-copy >/dev/null 2>&1" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \"wl-copy\"" \
    "if-shell \"command -v xclip >/dev/null 2>&1\" \
      \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard\\\"\" \
      \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel\""'


# =============================================================================
# 9. PLUGINS (TPM)
# =============================================================================

# Pin TPM's plugin directory. Without this, TPM's XDG detection resolves to
# ~/.config/tmux/plugins/ and clones plugins inside this repository.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

run '~/.tmux/plugins/tpm/tpm'
